<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F9FA" />
    <title>Ayurghar</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #F8F9FA;
        z-index: 9999;
      }
      #app-splash .mark {
        width: 84px;
        height: 84px;
        animation: ayurghar-breathe 1.8s ease-in-out infinite;
      }
      #app-splash .word {
        height: 30px;
        opacity: 0;
        animation: ayurghar-rise 0.6s ease-out 0.15s forwards;
      }
      #app-splash .bar {
        width: 96px;
        height: 3px;
        border-radius: 999px;
        background: #f2e2d3;
        overflow: hidden;
      }
      #app-splash .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #f26f21;
        border-radius: 999px;
        animation: ayurghar-sweep 1.1s ease-in-out infinite;
      }
      @keyframes ayurghar-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes ayurghar-rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes ayurghar-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .mark { animation: none; }
        #app-splash .word { animation: none; opacity: 1; }
        #app-splash .bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <img class="mark" src="/logo-icon-256.png" alt="" width="84" height="84" />
        <img class="word" src="/logo-wordmark.png" alt="Ayurghar" height="30" />
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
